<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Frost Rune Knob</title>
        <style>
            @font-face {
                font-family: "Norse Code";
                src: url("./norse_code/norskode.ttf") format("truetype");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "NorseCode";
                src: url("./norse_code/norskode.ttf") format("truetype");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Norse";
                src: url("./norse/Norse.otf") format("opentype");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Norse";
                src: url("./norse/Norsebold.otf") format("opentype");
                font-weight: 700;
                font-style: normal;
                font-display: swap;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px 16px;
                background: #111b22;
            }

            .demo-shell {
                display: grid;
                justify-items: center;
                gap: 12px;
                width: min(92vw, 680px);
            }

            .brand-lockup {
                display: grid;
                justify-items: center;
                gap: 4px;
                line-height: 0.88;
                text-align: center;
                text-transform: uppercase;
                white-space: nowrap;
                filter:
                    drop-shadow(0 2px 0 rgba(20, 15, 9, 0.92))
                    drop-shadow(0 6px 2px rgba(0, 0, 0, 0.8))
                    drop-shadow(0 11px 5px rgba(0, 0, 0, 0.55));
            }

            .brand-lockup__main,
            .brand-lockup__sub {
                font-family: "Norse", Georgia, serif;
                font-weight: 700;
                letter-spacing: 0.02em;
                color: #d6be83;
                -webkit-text-stroke: 1.4px rgba(34, 24, 12, 0.9);
                text-shadow:
                    0 -2px 0 rgba(255, 242, 190, 0.85),
                    0 2px 0 rgba(79, 50, 18, 0.95),
                    2px 3px 0 rgba(24, 18, 12, 0.95),
                    4px 5px 0 rgba(0, 0, 0, 0.62),
                    0 0 2px rgba(255, 238, 174, 0.75);
                background:
                    linear-gradient(
                        180deg,
                        #fff2b8 0%,
                        #d7b868 21%,
                        #8f6126 48%,
                        #f0d58a 58%,
                        #6a4218 78%,
                        #2d1b0b 100%
                    ),
                    url("dirtmap.png");
                background-blend-mode: overlay;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .brand-lockup__main {
                font-size: clamp(58px, 14vw, 112px);
            }

            .brand-lockup__sub {
                font-size: clamp(30px, 7vw, 56px);
            }

            .knob-stage {
                position: relative;
                width: min(92vw, 560px);
                aspect-ratio: 1;
                display: grid;
                place-items: center;
            }

            .frost-rune-knob {
                width: 100%;
                height: 100%;
                overflow: visible;
                cursor: grab;
                outline: none;
                touch-action: none;
                user-select: none;
            }

            .frost-rune-knob:active {
                cursor: grabbing;
            }

            .frost-rune-knob:focus-visible {
                filter: drop-shadow(0 0 12px rgba(120, 238, 255, 0.35));
            }

            .outer-body {
                fill: url(#outer-body-gradient);
                filter: url(#outer-shadow);
            }

            .outer-frost {
                fill: none;
                stroke: black;
                stroke-width: 5;
                stroke-linecap: round;
                opacity: 1;
                filter: url(#frayed-edge);
            }

            .outer-dark-cut {
                fill: none;
                stroke: #061118;
                stroke-width: 11;
                opacity: 0.86;
            }

            .rune-ring {
                fill: url(#rune-ring-gradient);
                stroke: rgba(220, 250, 255, 0.42);
                stroke-width: 2;
            }

            .rune-ring-inner-shadow {
                fill: none;
                stroke: #02070b;
                stroke-width: 18;
                opacity: 0.62;
                filter: url(#soft-blur);
            }

            .rune-glyph {
                fill: rgba(92, 135, 146, 0.56);
                font-family: "Norse Code", "NorseCode", Georgia, serif;
                font-size: 24px;
                font-weight: 400;
                letter-spacing: 0;
                text-anchor: middle;
                dominant-baseline: middle;
                transition:
                    fill 160ms ease,
                    opacity 160ms ease;
            }

            .rune-glyph.is-lit {
                fill: #dff9ff;
                filter: url(#rune-glow);
                opacity: 1;
            }

            .inner-well {
                fill: #071019;
                stroke: rgba(177, 225, 240, 0.34);
                stroke-width: 3;
                filter: url(#inner-well-organic);
            }

            .bevel-ring {
                fill: none;
                stroke: url(#bevel-gradient);
                filter: url(#bevel-organic);
                opacity: calc(0.52 + var(--dial-ratio, 0) * 0.48);
                stroke-width: calc(13px + var(--dial-ratio, 0) * 7px);
                animation: bevel-pulse 3.8s ease-in-out infinite;
            }

            .cap {
                transition: transform 120ms ease;
            }

            .cap-indicator {
                transform: rotate(var(--dial-angle, -135deg));
                transform-box: view-box;
                transform-origin: 210px 190px;
                transition: transform 120ms ease;
            }

            .cap-face {
                fill: url(#cap-gradient);
                filter: url(#cap-shadow);
            }

            .cap-texture {
                mix-blend-mode: color-burn;
                opacity: 0.4;
            }

            .cap-radial-lines path {
                fill: rgba(223, 250, 255, 0.12);
                filter: url(#cap-line-blur);
            }

            .cap-rim-dark {
                fill: none;
                stroke: #02090d;
                stroke-width: 8;
                opacity: 0.72;
                filter: url(#rim-organic);
            }

            .cap-rim-light {
                fill: none;
                stroke: rgba(218, 250, 255, 0.72);
                stroke-width: 3;
                opacity: 0.75;
                filter: url(#rim-organic);
            }

            .top-pointer {
                fill: #d9faff;
                stroke: #091722;
                stroke-width: 3;
                filter: url(#small-shadow);
            }

            .cap-triangle {
                fill: rgba(99, 225, 250, 0.58);
                stroke: rgba(224, 255, 255, 0.76);
                stroke-width: 3;
                filter: url(#cyan-glow);
            }

            .value-arc {
                fill: none;
                stroke: #6defff;
                stroke-width: 10;
                stroke-linecap: round;
                filter: url(#cyan-glow);
            }

            .value-arc-shadow {
                fill: none;
                stroke: rgba(5, 14, 20, 0.72);
                stroke-width: 16;
                stroke-linecap: round;
            }

            .arc-arrow {
                fill: #6defff;
                filter: url(#cyan-glow);
            }

            .ice-dust {
                mix-blend-mode: screen;
                opacity: 0.33;
            }

            .meter-stage {
                width: min(92vw, 620px);
            }

            .frost-meter-svg {
                display: block;
                width: 100%;
                height: auto;
                overflow: visible;
            }

            .meter-shadow {
                fill: rgba(0, 0, 0, 0.58);
                filter: blur(7px);
                transform: translateY(9px);
            }

            .meter-edge-crust {
                fill: none;
                stroke: #000407;
                stroke-width: 16;
                opacity: 0.9;
                filter: url(#meter-crust-displace);
            }

            .meter-frame {
                fill: url(#meter-frame-gradient);
                stroke: rgba(205, 244, 252, 0.08);
                stroke-width: 1.5;
                filter: url(#meter-frame-organic);
            }

            .meter-bevel {
                fill: none;
                stroke: url(#meter-bevel-gradient);
                stroke-width: 11;
                opacity: 0.48;
                filter: url(#meter-bevel-organic);
            }

            .meter-inner-bevel {
                fill: none;
                stroke: url(#meter-inner-bevel-gradient);
                stroke-width: 9;
                opacity: 0.5;
                filter: url(#meter-rim-organic);
            }

            .meter-grain {
                fill: url(#meter-ice-grain);
                opacity: 0.82;
                mix-blend-mode: screen;
                filter: url(#meter-rough-frame);
            }

            .meter-dirt {
                opacity: 0.48;
                mix-blend-mode: color-burn;
                filter: url(#meter-surface-warp);
            }

            .meter-rim {
                fill: none;
                stroke: rgba(0, 5, 8, 0.96);
                stroke-width: 12;
                filter: url(#meter-rim-organic);
            }

            .meter-track-shadow {
                fill: rgba(0, 0, 0, 0.74);
                filter: blur(2px);
            }

            .meter-track {
                fill: url(#meter-track-gradient);
                stroke: rgba(170, 231, 240, 0.14);
                stroke-width: 1.5;
                filter: url(#meter-track-displace);
            }

            .meter-track-dirt {
                fill: url(#meter-track-dirt-pattern);
                opacity: 0.32;
                mix-blend-mode: color-burn;
                filter: url(#meter-track-displace);
            }

            .meter-track-rim {
                fill: none;
                stroke: rgba(222, 251, 255, 0.16);
                stroke-width: 3;
                filter: url(#meter-rim-organic);
            }

            .meter-fill {
                fill: url(#meter-fill-gradient);
                filter: url(#meter-fill-glow);
                opacity: 0.88;
            }

            .meter-fill-texture {
                fill: url(#meter-fill-grain);
                opacity: 0.36;
                mix-blend-mode: screen;
                filter: url(#meter-fill-displace);
            }

            .meter-fill-scan {
                fill: none;
                stroke: rgba(255, 255, 255, 0.26);
                stroke-width: 2;
                stroke-dasharray: 2 7;
            }

            .meter-channel-label {
                fill: #d9faff;
                font-family: "Norse", Georgia, serif;
                font-size: 36px;
                text-anchor: middle;
                dominant-baseline: middle;
                paint-order: stroke fill;
                stroke: rgba(3, 10, 15, 0.86);
                stroke-width: 3.5;
                filter: url(#meter-label-glow);
            }

            @keyframes bevel-pulse {
                0%,
                100% {
                    opacity: calc(0.52 + var(--dial-ratio, 0) * 0.42);
                }
                50% {
                    opacity: calc(0.62 + var(--dial-ratio, 0) * 0.38);
                }
            }
        </style>
    </head>
    <body>
        <main class="demo-shell">
            <div class="brand-lockup" aria-label="Frost Verb Nursven">
                <div class="brand-lockup__main">Frost Verb</div>
                <div class="brand-lockup__sub">Nursven</div>
            </div>
            <div class="knob-stage">
                <svg
                    class="frost-rune-knob"
                    viewBox="0 0 420 420"
                    role="slider"
                    tabindex="0"
                    aria-label="Frost rune dial"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >
                <defs>
                    <clipPath id="outer-clip">
                        <circle cx="210" cy="190" r="151" />
                    </clipPath>

                    <clipPath id="rune-ring-clip">
                        <path
                            fill-rule="evenodd"
                            clip-rule="evenodd"
                            d="M210 55a135 135 0 1 1 0 270a135 135 0 1 1 0-270M210 98a92 92 0 1 0 0 184a92 92 0 1 0 0-184"
                        />
                    </clipPath>

                    <clipPath id="cap-clip">
                        <circle cx="210" cy="190" r="79" />
                    </clipPath>

                    <path
                        id="rune-path"
                        d="M82 190a128 128 0 1 1 256 0a128 128 0 1 1-256 0"
                    />

                    <radialGradient
                        id="outer-body-gradient"
                        cx="38%"
                        cy="23%"
                        r="76%"
                    >
                        <stop offset="0" stop-color="#8fb9cc" />
                        <stop offset=".25" stop-color="#33586d" />
                        <stop offset=".58" stop-color="#0d2535" />
                        <stop offset="1" stop-color="#030b14" />
                    </radialGradient>

                    <radialGradient
                        id="rune-ring-gradient"
                        cx="38%"
                        cy="22%"
                        r="82%"
                    >
                        <stop offset="0" stop-color="#8ebed1" />
                        <stop offset=".22" stop-color="#426a80" />
                        <stop offset=".52" stop-color="#173447" />
                        <stop offset=".78" stop-color="#071722" />
                        <stop offset="1" stop-color="#02070d" />
                    </radialGradient>

                    <radialGradient id="cap-gradient" cx="39%" cy="28%" r="76%">
                        <stop offset="0" stop-color="#bfefff" />
                        <stop offset=".18" stop-color="#6f9fb6" />
                        <stop offset=".46" stop-color="#294f65" />
                        <stop offset=".72" stop-color="#0b2333" />
                        <stop offset="1" stop-color="#030a12" />
                    </radialGradient>

                    <linearGradient
                        id="bevel-gradient"
                        x1="120"
                        y1="90"
                        x2="300"
                        y2="295"
                    >
                        <stop offset="0" stop-color="#aeefff" />
                        <stop offset=".24" stop-color="#3f748d" />
                        <stop offset=".54" stop-color="#06111c" />
                        <stop offset=".78" stop-color="#1b4963" />
                        <stop offset="1" stop-color="#030a12" />
                    </linearGradient>

                    <pattern
                        id="dirt-pattern"
                        width="92"
                        height="92"
                        patternUnits="userSpaceOnUse"
                    >
                        <image
                            href="dirtmap-2.png"
                            width="92"
                            height="92"
                            preserveAspectRatio="none"
                        />
                    </pattern>

                    <pattern
                        id="cap-dirt-pattern"
                        width="76"
                        height="76"
                        patternUnits="userSpaceOnUse"
                    >
                        <image
                            href="dirtmap.png"
                            width="76"
                            height="76"
                            preserveAspectRatio="none"
                        />
                    </pattern>

                    <filter
                        id="outer-shadow"
                        x="-30%"
                        y="-30%"
                        width="160%"
                        height="170%"
                    >
                        <feDropShadow
                            dx="0"
                            dy="16"
                            stdDeviation="11"
                            flood-color="#000"
                            flood-opacity=".72"
                        />
                        <feDropShadow
                            dx="0"
                            dy="-3"
                            stdDeviation="3"
                            flood-color="#000"
                            flood-opacity=".24"
                        />
                    </filter>

                    <filter
                        id="frayed-edge"
                        x="-18%"
                        y="-18%"
                        width="136%"
                        height="136%"
                    >
                        <feTurbulence
                            baseFrequency="0.09"
                            numOctaves="10"
                            seed="22"
                            type="fractalNoise"
                            result="noise"
                        ></feTurbulence>
                        <feDisplacementMap
                            in="SourceGraphic"
                            in2="noise"
                            scale="40"
                            xChannelSelector="R"
                            yChannelSelector="G"
                        ></feDisplacementMap>
                    </filter>

                    <filter id="soft-blur">
                        <feGaussianBlur stdDeviation="1" />
                    </filter>

                    <filter id="cap-line-blur">
                        <feGaussianBlur stdDeviation="1.4" />
                    </filter>

                    <filter
                        id="inner-well-organic"
                        x="-25%"
                        y="-25%"
                        width="150%"
                        height="150%"
                    >
                        <feTurbulence
                            baseFrequency=".045"
                            numOctaves="3"
                            seed="41"
                            type="fractalNoise"
                            result="ring-noise"
                        />
                        <feDisplacementMap
                            in="SourceGraphic"
                            in2="ring-noise"
                            scale="2.2"
                            xChannelSelector="R"
                            yChannelSelector="G"
                            result="warped-ring"
                        />
                        <feDropShadow
                            in="warped-ring"
                            dx="0"
                            dy="6"
                            stdDeviation="5"
                            flood-color="#000"
                            flood-opacity=".78"
                        />
                    </filter>

                    <filter
                        id="bevel-organic"
                        x="-35%"
                        y="-35%"
                        width="170%"
                        height="170%"
                    >
                        <feTurbulence
                            baseFrequency=".052"
                            numOctaves="3"
                            seed="67"
                            type="fractalNoise"
                            result="bevel-noise"
                        />
                        <feDisplacementMap
                            in="SourceGraphic"
                            in2="bevel-noise"
                            scale="2.8"
                            xChannelSelector="R"
                            yChannelSelector="G"
                            result="warped-bevel"
                        />
                        <feDropShadow
                            in="warped-bevel"
                            dx="0"
                            dy="3"
                            stdDeviation="2.5"
                            flood-color="#000"
                            flood-opacity=".58"
                        />
                        <feDropShadow
                            dx="0"
                            dy="0"
                            stdDeviation="3.4"
                            flood-color="#8df5ff"
                            flood-opacity=".18"
                        >
                            <animate
                                attributeName="flood-opacity"
                                values=".1;.34;.1"
                                dur="3.8s"
                                repeatCount="indefinite"
                            />
                        </feDropShadow>
                    </filter>

                    <filter
                        id="rim-organic"
                        x="-18%"
                        y="-18%"
                        width="136%"
                        height="136%"
                    >
                        <feTurbulence
                            baseFrequency=".075"
                            numOctaves="2"
                            seed="89"
                            type="fractalNoise"
                            result="rim-noise"
                        />
                        <feDisplacementMap
                            in="SourceGraphic"
                            in2="rim-noise"
                            scale="3.5"
                            xChannelSelector="R"
                            yChannelSelector="G"
                        />
                    </filter>

                    <filter
                        id="small-shadow"
                        x="-35%"
                        y="-35%"
                        width="170%"
                        height="170%"
                    >
                        <feDropShadow
                            dx="0"
                            dy="3"
                            stdDeviation="2.5"
                            flood-color="#000"
                            flood-opacity=".58"
                        />
                    </filter>

                    <filter
                        id="cap-shadow"
                        x="-35%"
                        y="-35%"
                        width="170%"
                        height="170%"
                    >
                        <feDropShadow
                            dx="0"
                            dy="8"
                            stdDeviation="6"
                            flood-color="#000"
                            flood-opacity=".68"
                        />
                        <feDropShadow
                            dx="0"
                            dy="-2"
                            stdDeviation="2"
                            flood-color="#e9fbff"
                            flood-opacity=".25"
                        />
                    </filter>

                    <filter
                        id="rune-glow"
                        x="-20%"
                        y="-20%"
                        width="140%"
                        height="140%"
                    >
                        <feDropShadow
                            dx="0"
                            dy="0"
                            stdDeviation="5"
                            flood-color="#a7efff"
                            flood-opacity="1"
                        />
                         <feDropShadow
                            dx="0"
                            dy="0"
                            stdDeviation="5"
                            flood-color="#a7efff"
                            flood-opacity="1"
                        />
                    </filter>

                    <filter
                        id="cyan-glow"
                        x="-80%"
                        y="-80%"
                        width="260%"
                        height="260%"
                    >
                        <feDropShadow
                            dx="0"
                            dy="0"
                            stdDeviation="3"
                            flood-color="#5eeaff"
                            flood-opacity="1"
                        />
                        <feDropShadow
                            dx="0"
                            dy="0"
                            stdDeviation="4"
                            flood-color="#5eeacc"
                            flood-opacity="1"
                        />
                    </filter>
                </defs>

                <circle class="outer-body" cx="210" cy="190" r="151" />
                <circle class="outer-frost" cx="210" cy="190" r="151" />

                <g clip-path="url(#outer-clip)">
                    <image
                        class="ice-dust"
                        href="dirtmap-2.png"
                        x="44"
                        y="24"
                        width="332"
                        height="332"
                        preserveAspectRatio="xMidYMid slice"
                    />
                    <rect
                        class="ice-dust"
                        x="44"
                        y="24"
                        width="332"
                        height="332"
                        fill="url(#dirt-pattern)"
                    />
                </g>

                <circle class="rune-ring" cx="210" cy="190" r="128" />

                <g clip-path="url(#rune-ring-clip)">
                    <rect
                        x="72"
                        y="52"
                        width="276"
                        height="276"
                        fill="url(#dirt-pattern)"
                        opacity=".22"
                    />
                    <circle
                        class="rune-ring-inner-shadow"
                        cx="210"
                        cy="190"
                        r="98"
                    />
                </g>

                <g class="rune-glyphs" aria-hidden="true"></g>

                <circle class="inner-well" cx="210" cy="190" r="93" />
                <circle class="bevel-ring" cx="210" cy="190" r="87" />

                <g class="cap">
                    <circle class="cap-face" cx="210" cy="190" r="79" />
                    <g clip-path="url(#cap-clip)">
                        <rect
                            class="cap-texture"
                            x="131"
                            y="111"
                            width="158"
                            height="158"
                            fill="url(#cap-dirt-pattern)"
                        />
                        <g class="cap-radial-lines">
                            <path d="M210 190L154 119a96 96 0 0 1 56-18z" />
                            <path d="M210 190l78-22a96 96 0 0 1-15 74z" />
                            <path d="M210 190l-69 42a96 96 0 0 1-10-70z" />
                            <path d="M210 190l11 80a96 96 0 0 1-61-21z" />
                        </g>
                    </g>
                    <circle class="cap-rim-dark" cx="210" cy="190" r="79" />
                    <circle class="cap-rim-light" cx="210" cy="190" r="75" />
                </g>
                <g class="cap-indicator">
                    <path class="top-pointer" d="M210 89l12 35h-24z" />
                    <path class="cap-triangle" d="M210 135l8 15h-16z" />
                </g>
                </svg>
            </div>
            <div class="meter-stage" aria-label="Frost stereo meter">
                <svg class="frost-meter-svg" viewBox="0 0 620 134" role="img" aria-label="Stereo frost meter">
                    <defs>
                        <linearGradient id="meter-frame-gradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#9fb9c2" />
                            <stop offset=".13" stop-color="#607983" />
                            <stop offset=".32" stop-color="#273f4c" />
                            <stop offset=".54" stop-color="#0a1922" />
                            <stop offset=".76" stop-color="#466575" />
                            <stop offset="1" stop-color="#071015" />
                        </linearGradient>
                        <linearGradient id="meter-bevel-gradient" x1="12" y1="8" x2="608" y2="126">
                            <stop offset="0" stop-color="#d7eef2" />
                            <stop offset=".2" stop-color="#78919b" />
                            <stop offset=".48" stop-color="#071016" />
                            <stop offset=".72" stop-color="#274f60" />
                            <stop offset="1" stop-color="#010407" />
                        </linearGradient>
                        <linearGradient id="meter-inner-bevel-gradient" x1="62" y1="24" x2="574" y2="100">
                            <stop offset="0" stop-color="#b9d8de" />
                            <stop offset=".28" stop-color="#264a59" />
                            <stop offset=".62" stop-color="#02080c" />
                            <stop offset="1" stop-color="#7db8c4" />
                        </linearGradient>
                        <linearGradient id="meter-track-gradient" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#0a2029" />
                            <stop offset=".55" stop-color="#071016" />
                            <stop offset="1" stop-color="#03070a" />
                        </linearGradient>

        </main>
        <script>
            const knob = document.querySelector(".frost-rune-knob");
            const runeGlyphs = document.querySelector(".rune-glyphs");
            const meterFillL = document.querySelectorAll(".meter-fill-l");
            const meterFillR = document.querySelectorAll(".meter-fill-r");
            const meterScanL = document.querySelector(".meter-scan-l");
            const meterScanR = document.querySelector(".meter-scan-r");
            let dialValue = 0;
            const dialMinAngle = -135;
            const dialMaxAngle = 135;
            const runeAngles = [];

            function clamp(value, min, max) {
                return Math.min(max, Math.max(min, value));
            }

            function setDialValue(value) {
                dialValue = clamp(value, 0, 100);
                const ratio = dialValue / 100;
                const angle = dialMinAngle + (dialValue / 100) * (dialMaxAngle - dialMinAngle);

                knob?.style.setProperty("--dial-angle", `${angle}deg`);
                knob?.style.setProperty("--dial-ratio", ratio.toFixed(3));
                knob?.setAttribute("aria-valuenow", `${Math.round(dialValue)}`);
                updateRuneGlow(angle);
                updateMeters(ratio);
            }

            function createRuneGlyphs() {
                if (!(runeGlyphs instanceof SVGGElement)) return;

                const runes = "FROSTVERBNURSVEND";
                const centerX = 210;
                const centerY = 190;
                const radius = 121;
                const startAngle = dialMinAngle;
                const endAngle = dialMaxAngle;

                runeGlyphs.replaceChildren();
                runeAngles.length = 0;

                [...runes].forEach((rune, index) => {
                    const ratio = runes.length === 1 ? 0 : index / (runes.length - 1);
                    const angle = startAngle + ratio * (endAngle - startAngle);
                    const radians = (angle * Math.PI) / 180;
                    const x = centerX + Math.sin(radians) * radius;
                    const y = centerY - Math.cos(radians) * radius;
                    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");

                    text.classList.add("rune-glyph");
                    text.textContent = rune;
                    text.setAttribute("x", x.toFixed(2));
                    text.setAttribute("y", y.toFixed(2));
                    text.setAttribute("transform", `rotate(${angle.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})`);

                    runeGlyphs.append(text);
                    runeAngles.push(angle);
                });
            }

            function updateRuneGlow(currentAngle) {
                if (!(runeGlyphs instanceof SVGGElement)) return;

                [...runeGlyphs.children].forEach((glyph, index) => {
                    glyph.classList.toggle("is-lit", currentAngle >= runeAngles[index]);
                });
            }

            function updateMeters(ratio) {
                const trackWidth = 500;
                const leftWidth = trackWidth * ratio;
                const rightWidth = trackWidth * clamp(ratio * 0.88 + 0.08, 0, 1);

                meterFillL.forEach((element) => element.setAttribute("width", leftWidth.toFixed(1)));
                meterFillR.forEach((element) => element.setAttribute("width", rightWidth.toFixed(1)));
                meterScanL?.setAttribute("d", `M74 38H${(68 + leftWidth).toFixed(1)}`);
                meterScanR?.setAttribute("d", `M74 80H${(68 + rightWidth).toFixed(1)}`);
            }

            function updateDialFromPointer(event) {
                if (!(knob instanceof SVGSVGElement)) return;

                const rect = knob.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height * (190 / 420);
                const dx = event.clientX - centerX;
                const dy = event.clientY - centerY;
                let angle = (Math.atan2(dy, dx) * 180) / Math.PI + 90;

                if (angle > 180) angle -= 360;

                angle = clamp(angle, dialMinAngle, dialMaxAngle);
                setDialValue(((angle - dialMinAngle) / (dialMaxAngle - dialMinAngle)) * 100);
            }

            function startDialDrag(event) {
                if (!(knob instanceof SVGSVGElement)) return;

                knob.setPointerCapture(event.pointerId);
                updateDialFromPointer(event);
            }

            function dragDial(event) {
                if (!(knob instanceof SVGSVGElement) || !knob.hasPointerCapture(event.pointerId)) return;

                updateDialFromPointer(event);
            }

            function endDialDrag(event) {
                if (!(knob instanceof SVGSVGElement) || !knob.hasPointerCapture(event.pointerId)) return;

                knob.releasePointerCapture(event.pointerId);
            }

            knob?.addEventListener("pointerdown", startDialDrag);
            knob?.addEventListener("pointermove", dragDial);
            knob?.addEventListener("pointerup", endDialDrag);
            knob?.addEventListener("pointercancel", endDialDrag);
            knob?.addEventListener("keydown", (event) => {
                if (event.key === "ArrowRight" || event.key === "ArrowUp") {
                    event.preventDefault();
                    setDialValue(dialValue + 2);
                }

                if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
                    event.preventDefault();
                    setDialValue(dialValue - 2);
                }
            });
            knob?.addEventListener(
                "wheel",
                (event) => {
                    event.preventDefault();
                    setDialValue(dialValue + (event.deltaY < 0 ? 2 : -2));
                },
                { passive: false },
            );

            createRuneGlyphs();
            setDialValue(0);
        </script>
