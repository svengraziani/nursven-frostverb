[package]
name = "frostverb"
version = "0.1.0"
edition = "2024"
description = "Frost Verb character reverb DSP core and product scaffold"
license = "UNLICENSED"

[dependencies]
egui = { version = "0.34.2", optional = true }

[features]
default = []
gui = ["dep:egui"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "frostverb-render"
path = "src/bin/frostverb-render.rs"

[[bin]]
name = "frostverb-dummy-host"
path = "src/bin/frostverb-dummy-host.rs"
